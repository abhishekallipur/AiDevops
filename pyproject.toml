[project]
name = "aidevops"
version = "0.1.0"
description = "Autonomous AI DevOps Engineer: analyze, plan, generate, validate, and run allowlisted checks."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
ui = ["streamlit>=1.40"]
llm = ["openai>=1.60"]
rag = ["scikit-learn>=1.5"]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
